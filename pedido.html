        <hr class="linha-degrade">
        <section class="pedido">
            <h1>Faça seu Pedido</h1>
            <form class="pedido-form">
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" required placeholder="Digite seu nome">

                <label for="address">Endereço:</label>
                <input type="text" id="address" name="address" required placeholder="Digite seu endereço">

                <label for="phone">Telefone:</label>
                <input type="tel" id="phone" name="phone" required placeholder="Digite seu telefone">

                <label for="order">Pedido:</label>
                <textarea id="order" name="order" rows="4" required placeholder="Descreva seu pedido"></textarea>

                <button id="btn-order" type="submit">Enviar Pedido</button>
            </form>

            </section>
        <footer>© Desenvolvido por Frank Kennady</footer>

    <script src="./product.js"></script>
